[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "format-cvs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.109.2",
    "docxtpl>=0.20.2",
    "fastapi[standard]>=0.136.3",
    "google-genai>=2.8.0",
    "mistralai-workflows>=3.7.0",
    "ollama>=0.6.2",
    "openai>=2.32.0",
    "pdfplumber>=0.11.8",
    "pyinstaller>=6.20.0",
    "pymupdf>=1.26.5",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pydantic-settings>=2.14.2",
    "pyright>=v1.1.410",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.26",
    "ruff>=0.15.11",
    "ty>=0.0.32",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
