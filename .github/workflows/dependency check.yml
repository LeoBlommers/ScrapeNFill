name: Dependency Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

jobs:
  check-dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Show outdated packages
        run: uv pip list --outdated